<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Teclas (Conectado)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #e8e8e8;
        }
        h3 {
         margin-bottom: 5px; 
         color: #333; 
        }

        p { 
        margin: 0 0 15px 0; 
        font-size: 13px; 
        color: #666; 
    }
        
        /* Área correspondente ao JTextArea do Java */
        #textAreaLog {
            width: 430px;
            height: 200px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        /* Rótulo correspondente ao JLabel do Java */
        #statusLabel {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <h3>Interface: Monitor de Teclado</h3>
    <p>Clique na página e comece a digitar para enviar o pressionamento de teclas do teclado</p>
    
    <div id="textAreaLog"></div>
    <div id="statusLabel">Pressione teclas do teclado...</div>

    <script>
        class KeyMonitorApp {
            constructor() {
                this.textAreaLog = document.getElementById('textAreaLog');
                this.statusLabel = document.getElementById('statusLabel');
                this.setupListeners();
            }

            setupListeners() {
                // Equivalente ao keyPressed do Java
                window.addEventListener('keydown', (e) => {
                    this.statusLabel.innerText = `Tecla Pressionada: ${e.key.toUpperCase()} (Código: ${e.keyCode})`;
                    this.enviarParaOJava(`keydown|${e.key.toUpperCase()}|${e.keyCode}`);
                });

                // Equivalente ao keyTyped do Java (captura caracteres reais)
                window.addEventListener('keypress', (e) => {
                    const caractere = e.key;
                    this.textAreaLog.innerText += `Caractere digitado: '${caractere}'\n`;
                    this.textAreaLog.scrollTop = this.textAreaLog.scrollHeight; // Auto-scroll
                    
                    this.enviarParaOJava(`keypress|${caractere}|0`);
                });
            }

            async enviarParaOJava(payload) {
                try {
                    await fetch('http://localhost:8081/evento-teclado', {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: payload
                    });
                } catch (erro) {
                    console.error("Erro na conexão com o Java:", erro);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new KeyMonitorApp();
        });
    </script>
</body>
</html>
